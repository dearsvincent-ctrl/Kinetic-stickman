name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build game
    runs-on: ubuntu-latest
    # Production touch/layout, sandbox and acrobatic checks use software WebGL.
    timeout-minutes: 25
    env:
      # GITHUB_REPOSITORY is supplied by Actions (owner/repository).
      GITHUB_PAGES: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run logic tests
        run: npm test
      - name: Build for this repository's Pages URL
        run: npm run build
      - name: Install Chromium for the deployed-asset check
        run: npx playwright install --with-deps chromium
      - name: Check production assets and touch controls
        run: npm run test:pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy game
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
